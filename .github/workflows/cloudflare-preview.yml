name: Cloudflare preview (workers.dev)

# Builds the OpenNext Cloudflare preview. Runs ONLY for the cloudflare-preview branch (never main, never pull
# requests). A push run builds and records the bundle size only. Creating the R2 bucket and deploying happen only
# on a manual run with deploy=true, and only to *.workers.dev (wrangler.jsonc has no routes / custom domains).
on:
  push:
    branches: [cloudflare-preview]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Create the preview R2 bucket if missing and deploy to workers.dev"
        type: boolean
        default: false

concurrency:
  group: cloudflare-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    if: github.ref == 'refs/heads/cloudflare-preview' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      # NEXT_PUBLIC_GA_MEASUREMENT_ID deliberately not passed: production (Vercel) does not set it, so its HTML has
      # no direct gtag.js tag (GA4 is not loaded by the app itself). Passing it here added a tag production lacks.
      NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint

      # Production-default proof: a plain build must pass check-preview-noindex.ts without the flag.
      - name: Production-default build (no preview header)
        run: npm run build

      - name: Add preview-only noindex to static-asset headers
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> public/_headers
          cat public/_headers

      # Runs `npm run build` (prebuild + next build + every postbuild check) and fails on any of them.
      - name: OpenNext Cloudflare build (preview)
        env:
          PREVIEW_NOINDEX: "1"
        run: npx opennextjs-cloudflare build

      # No Cloudflare credentials needed: --dry-run only bundles locally.
      - name: Record bundle size
        run: |
          { du -sh .open-next .open-next/assets .open-next/server-functions 2>/dev/null || true; } | tee bundle-size.txt
          npx wrangler deploy --dry-run --outdir .open-next/dry-run 2>&1 | tee -a bundle-size.txt
          grep -i "total upload" bundle-size.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-size
          path: bundle-size.txt
          if-no-files-found: error

      - name: Ensure preview R2 incremental-cache bucket exists
        if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx wrangler r2 bucket list | grep -q "permitbridge-preview-inc-cache"; then
            echo "bucket exists"
          else
            npx wrangler r2 bucket create permitbridge-preview-inc-cache
          fi

      - name: Deploy to workers.dev
        if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
