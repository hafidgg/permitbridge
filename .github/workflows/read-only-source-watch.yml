name: Read-Only Source Watch (Phase 3.4)

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      test_source_id:
        description: "OPTIONAL, TEST ONLY: override sourceId to consume a controlled fixture instead of the real source (e.g. wa-electrical-contractor-license-fee-controlled-399). Leave blank for normal real-source runs."
        required: false
        default: ""

jobs:
  read-only-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run read-only watch (Washington WAC 296-46B-909)
        id: watch
        env:
          TEST_SOURCE_ID: ${{ inputs.test_source_id }}
        run: |
          set +e
          if [ -n "$TEST_SOURCE_ID" ]; then
            echo "::warning::PHASE 3.7B CONTROLLED TEST RUN — using sourceId override: $TEST_SOURCE_ID (NOT the real Washington source check)"
            npm run watch:washington -- --mode=mock --source-id="$TEST_SOURCE_ID" | tee /tmp/watch-output.log
          else
            npm run watch:washington | tee /tmp/watch-output.log
          fi
          exit_code=${PIPESTATUS[0]}
          if grep -q "CHANGE_DETECTED" /tmp/watch-output.log; then
            echo "change_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "change_detected=false" >> "$GITHUB_OUTPUT"
          fi
          exit $exit_code
        shell: bash

      - name: Create/update GitHub Issue on CHANGE_DETECTED
        if: steps.watch.outputs.change_detected == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const sourceId = "wa-electrical-contractor-license-fee";
            const label = "change-detected";
            const titlePrefix = `[CHANGE_DETECTED] ${sourceId}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            const match = existing.data.find((issue) => issue.title.startsWith(titlePrefix));

            const body = [
              `An official source value changed and was detected by the read-only monitor.`,
              ``,
              `- **Source:** ${sourceId}`,
              `- **Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- **Detected:** ${new Date().toISOString()}`,
              ``,
              `No automatic action was taken. No production data was modified.`,
              `A human must review this and start the existing verification/approval workflow manually (\`npm run monitor:review\`).`,
            ].join("\n");

            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `Detected again:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${titlePrefix} — official value changed`,
                body,
                labels: [label],
              });
            }